    <body>
			<section class="SiteHeader Container Section">
				<h1 class="SiteTitle">
					<a href="/">
						<img alt="" src="public/logo.png"/>
						<span>LP/EP Finder</span>
					</a>
				</h1>
				<p>Find vinyls in local record stores around the world.</p>
				<p><small>
					Tips: try to add <code class="Clickable" onclick="lpepfinder.filterResults()">-"out of stock"</code> after your search
				</small></p>

		var lpepfinder = {
			// suffix search filter to search input value
			filterResults: function() {
				console.log('yolo')
				var input = document.querySelector('input.gsc-input')
				input.value = input.value + ' ' + '-"out of stock"'
			},

			// update the input placeholder
			updateSearchPlaceholder: function() {
				var input = document.querySelector('#gsc-i-id1');
				if(input) {
					input.placeholder = 'Artist, album, track, label, cat#, or anything, really'
				}
			},

			init: function() {
				this.updateSearchPlaceholder()
				// give a ready state to the html page
				document.querySelector('.SiteBody').classList.add('is-ready')
			}
		}

		window.onload = function(){
			lpepfinder.init()
		}
	</script>
