		/>

			rel="icon"
			type="image/png"
			href="/static/favicons/favicon-32x32.png"
			sizes="32x32"
		/>
		<link
			rel="icon"
			type="image/png"
			href="/static/favicons/favicon-16x16.png"
			sizes="16x16"
		/>
		<link rel="manifest" href="/static/favicons/manifest.json" />
		<link
			rel="mask-icon"
			href="/static/favicons/safari-pinned-tab.svg"
			color="#5bbad5"
		/>
		<link rel="shortcut icon" href="/static/favicons/favicon.ico" />
		<meta
			name="msapplication-config"
			content="/static/favicons/browserconfig.xml"
		/>

		<link

			type="application/opensearchdescription+xml"
			href="/opensearch.xml"
			title="Vinyl Finder, vinyl records search engine"
		/>

		<meta property="og:url" content="https://vinyl-finder.gitlab.io" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Vinyl Finder" />
		<meta
			property="og:description"
			content="Find vinyls online, in local record stores around the world."
		/>
		<meta property="og:image" content="./static/logo.png" />

		<link href="./styles/main.css" rel="stylesheet" type="text/css" />

		required for cse ads
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7578240828852744"
			crossorigin="anonymous"
		></script>
	</head>

	<body>
		<section class="SiteHeader Container Section">
			<h1 class="SiteTitle">
				<a href="./"> Vinyl Finder </a>
			</h1>
			<p>Search vinyls in local record stores around the 🌍 world.</p>
		</section>

		<section class="SiteBody Container Section">
			<gcse:searchbox gname="storesearch" enableHistory="true"></gcse:searchbox>
			<gcse:searchresults gname="storesearch"></gcse:searchresults>
			<p>
				<center>
					<small>
						Tips: try to add
						<code
							class="Clickable"
							onclick="lpepfinder.filterResults()"
							title='For example: daft punk -"out of stock", to avoid getting results for out of stock vinyls'
						>
							-"out of stock"
						</code>
						after your search
					</small>
				</center>
			</p>
		</section>

		<section class="SiteFooter Container Section">
			<aside>
				<nav class="Nav Nav--right">
					<a class="Nav-item" href="./about">About</a>
					<a
						class="Nav-item"
						href="https://matrix.to/#/#vinyl-finder:matrix.org"
						title="Community chat room on matrix.org"
						>#vinyl-finder:matrix.org</a
					>
				</nav>
			</aside>
		</section>

		<script
			async
			src="https://cse.google.com/cse.js?cx=010629519132760995870:yi4eyysyzr0"
		></script>

		<script
			async
			src="https://eu.umami.is/script.js"
			data-website-id="0c19139a-e4c0-4c1b-a355-f6403ac4bed8"
		></script>

		<script>
			var lpepfinder = {
				// suffix search filter to search input value
				filterResults: function () {
					var input = document.querySelector("input.gsc-input");
					input.value = input.value + " " + '-"out of stock"';
				},

				// update the input placeholder
				updateSearchPlaceholder: function () {
					var input = document.querySelector("#gsc-i-id1");
					if (input) {
						input.placeholder =
							"Artist, album, track, label, cat#, or anything, really";
					}
				},

				init: function () {
					this.updateSearchPlaceholder();
					// give a ready state to the html page
					document.querySelector(".SiteBody").classList.add("is-ready");
				},
			};

			window.onload = function () {
				lpepfinder.init();
			};
		</script>
	</body>
</html>
