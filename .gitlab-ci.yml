# Vinyl Finder: free GitLab CI + Pages.
#  - refresh (scheduled): discover new shops (monthly), check all shops, crawl catalogs -> generated/
#  - pages (main): build the search index and the Astro site from the latest generated/ data
image: node:22-alpine

stages: [refresh, deploy]

variables:
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

default:
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund
    # previous crawl data, so a failed shop keeps its records and builds need no crawl
    - >
      [ -f generated/products.ndjson.gz ] ||
      { wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O previous.zip
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/download?job=refresh"
      && unzip -oq previous.zip && rm previous.zip || echo "no previous refresh data"; }

refresh:
  stage: refresh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $REFRESH == "1"
  timeout: 3h
  script:
    - npm run validate
    - if [ "$DISCOVER" = "1" ]; then npm run discover; fi
    - npm run check
    - npm run crawl
  artifacts:
    paths: [generated/]
    expire_in: 90 days

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: refresh
      optional: true
  script:
    # never replace the live site with an empty index
    - test -f generated/products.ndjson.gz || { echo "No crawl data yet. Run a pipeline with REFRESH=1."; exit 1; }
    - npm run build
  pages:
    publish: dist
  artifacts:
    paths: [dist]
