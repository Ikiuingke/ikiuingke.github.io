---
---
stages:
  - site-publish

image: archlinux:latest

services:
  - docker:dind

before_script:
  - pacman -Syu --noconfirm
  - pacman -S --noconfirm nodejs npm emacs git

pages:
  stage: site-publish
  script:
    - npm install
    - npm run publish-pages
  artifacts:
    paths:
      - public
  only:
    - main
